name: Deployment
on:
  push:
    branches:
      - master
env:
  MONGODB_DB_NAME: cluster0
  PORT: 8080
jobs:
  test:    
    environment: testing
    runs-on: ubuntu-latest
    env:
      MONGODB_USERNAME: vishvaraja77_db_user
      MONGODB_PASSWORD: 23mqEGNKZ7pFpt9j
      MONGODB_CLUSTER_ADDRESS: bdsjsfbsd    
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-deps-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Run server
        run: npm start & npx wait-on http://127.0.0.1:$PORT
      - name: Run tests
        run: npm test
      - name: Output information
        run: echo "..."
  deploy:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Output information
        run: |        
          write-host "this is the port number : $env:PORT"
          write-host "another way to print he port number : ${{ env.PORT}}"
